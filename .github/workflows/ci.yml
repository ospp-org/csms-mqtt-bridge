name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    # Without a limit GitHub gives a job 360 minutes. This one takes under a minute: 16 to
    # 51 seconds over its 20 runs on main up to v0.2.1, and 42 to 51 since the Redis service
    # below was added. 20 minutes, the release job's limit, is over twenty times its longest
    # run and fails a hang in 20 minutes instead of 360.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x']

    # A real Redis for the eviction proof in src/__tests__/eviction.integration.test.ts.
    # That test fills memory and compares what was ACKED against what SURVIVED — a
    # defect no mock can reproduce, because under an eviction policy the failing
    # write reports success. The test skips when REDIS_INTEGRATION_URL is unset, and
    # its first case fails the build if that ever happens while CI=true, so it cannot
    # quietly stop running.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test
        env:
          REDIS_INTEGRATION_URL: redis://localhost:6379

      - name: Build
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.js
